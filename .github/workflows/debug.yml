name: Debug LC Launcher
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      target: windows
                    - os: macos-latest
                      target: darwin
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                node-version: latest

            - name: Install installer deps (Windows)
              if: matrix.os == 'windows-latest'
              shell: powershell
              run: choco install nsis -y

            - name: Install installer deps (Mac)
              if: matrix.os == 'macos-latest'
              run: HOMEBREW_REQUIRE_TAP_TRUST=1 brew install create-dmg

            - name: Build lib
              run: bun ./build-scripts/build-lib.js ${{ matrix.target }}

            - name: Build app
              run: node ./build-scripts/build.js ${{ matrix.target }} --debug

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build-${{ matrix.target }}
                path: |
                  dist/
                  !dist/__*

    build-appimage:
      name: "${{ matrix.name }} (${{ matrix.arch }})"
      runs-on: ${{ matrix.runs-on }}
      strategy:
        matrix:
          include:
            - runs-on: ubuntu-latest
              name: Build AppImage
              arch: x86_64
            - runs-on: ubuntu-24.04-arm
              name: Build AppImage
              arch: aarch64
      container: ghcr.io/pkgforge-dev/archlinux:latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Preparing Container
          uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2
        - name: Install Dependencies
          run: /bin/sh ./build-scripts/sharun/get-dependencies.sh
        - name: Make AppImage
          run: /bin/sh ./build-scripts/sharun/make-appimage.sh
        - name: Upload artifact
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: AppImage-${{ matrix.arch }}
            path: |
              dist/*.AppImage*

    publish:
        needs: [build, build-appimage]
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                path: artifacts
                merge-multiple: true

            - name: Publish release
              uses: softprops/action-gh-release@v3
              with:
                tag_name: debug-${{ github.run_id }}
                name: "Debug Build ${{ github.run_id }}"
                body: "# If you're not a dev, please use the nightly releases, not debug!\nIf you have any issues with the builds below, please contact an LC Launcher dev in our discord!"
                target_commitish: ${{ github.sha }}
                generate_release_notes: false
                prerelease: true
                make_latest: true
                files: artifacts/*
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}